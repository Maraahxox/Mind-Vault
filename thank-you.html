<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Mind Vault</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }

        .thank-you-message {
            background: rgba(74, 14, 78, 0.1);
            border: 1px solid #8a2be2;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.5);
            backdrop-filter: blur(10px);
            max-width: 600px;
            margin-bottom: 40px;
        }

        .thank-you-message h1 {
            color: #8a2be2;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #8a2be2;
        }

        .thank-you-message p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .back-link {
            background: #8a2be2;
            color: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 20px #8a2be2;
        }

        .back-link:hover {
            background: #9932cc;
            box-shadow: 0 0 40px #8a2be2;
            transform: translateY(-2px);
        }

        .celebration-icon {
            font-size: 4rem;
            color: #ba55d3;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="thank-you-container">
        <div class="thank-you-message">
            <div class="celebration-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Thank You!</h1>
            <p id="thank-you-text">Your submission has been received successfully. We'll be in touch soon!</p>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Mind Vault
        </a>
    </div>

    <script>
        // Get the thank you message type from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const formType = urlParams.get('form');

        const thankYouText = document.getElementById('thank-you-text');

        if (formType === 'early-access') {
            thankYouText.textContent = "Thank you for joining the Early Supporters List! We'll be in touch soon with exclusive updates.";
        } else if (formType === 'contact') {
            thankYouText.textContent = "Thank you for your message! We'll get back to you as soon as possible.";
        }

        // Generate particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.width = (Math.random() * 10 + 5) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
